name: CI

on:
  push:
    branches: [main, dev, claude-code/self-improve]
  pull_request:
    branches: [main, dev, claude-code/self-improve]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check backend

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -e '.[dev]'

      - name: Pytest
        run: pytest

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
