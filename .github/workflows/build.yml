name: Build Docker Image

# main 的镜像在 Release workflow 成功之后构建（workflow_run），确保构建时
# checkout 到含新版本号的 release commit（push 并行触发会导致镜像版本号滞后）；
# dev 分支无 release 流程，保持 push 直接构建。
on:
  push:
    branches: [dev]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/wmy2981/connection-checker

jobs:
  build-push:
    runs-on: ubuntu-latest
    # workflow_run 触发时仅在 Release 成功后才构建
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
