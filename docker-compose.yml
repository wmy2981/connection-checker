services:
  connection-checker:
    image: ghcr.io/wmy2981/connection-checker:latest
    build:
      context: .
    container_name: connection-checker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 必改：登录访问码，以环境变量为权威（修改后重启生效）。留空则不启用认证、直接进入面板（仅限可信内网）。
      CONNECTCHECKER_ACCESS_CODE: change-me
      # 容器时区：所有时间显示与历史筛选均以此为准（IANA 名称，如 Asia/Shanghai）
      TZ: Asia/Shanghai
      # HTTPS 反向代理部署时开启 Secure Cookie
      # CONNECTCHECKER_COOKIE_SECURE: "true"
    cap_add:
      # ICMP ping 需要原始套接字权限
      - NET_RAW
    volumes:
      - ./data:/app/data
